[package]
name = "npgen"
version = "2.0.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Rust rewrite of NPGenerator V2.0.2"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "npgen"
path = "src/main.rs"

[dependencies]
wasm-bindgen = "0.2.89"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
